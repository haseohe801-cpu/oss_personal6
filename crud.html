<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Management</title>

    <style>
        body {
            font-family: Arial;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }
        form {
        background: #f5f5f5;
        padding: 20px;
        margin-bottom: 20px;
        }
        input, select, button {
            padding: 8px;
            margin-right: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        .edit {
            background: #3498db;
            color: white;
            border: none;
        }
        .delete {
            background: #e74c3c;
            color: white;
            border: none;
        }
        button:hover {
            opacity: 0.8;
        }
        #message {
            margin-bottom: 10px;
            font-weight: bold;
        }
        .error {
            color: #e74c3c;
        }
        .success {
            color: #27ae60;
        }
        #searchInput {
            width: 200px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
<h1>Product Management</h1>

    <div id="message"></div>

    <form id="productForm">
        <input type="text" id="name" placeholder="상품명">

        <select id="category">
            <option value="">카테고리 선택</option>
            <option value="Food">Food</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
        </select>

        <input type="number" id="price" placeholder="가격">
        <input type="number" id="stock" placeholder="재고">
        <button type="submit" id="saveBtn">Add</button>
    </form>

    <input type="text" id="searchInput" placeholder="상품명 검색">

<table>
    <thead>
        <tr>
            <th>id</th>
            <th>상품명</th>
            <th>카테고리</th>
            <th>가격</th>
            <th>재고</th>
            <th>제품관리</th>
        </tr>
    </thead>

    <tbody id="productList">
        <!-- 자바스크립트가 여기에 상품 줄<tr>들을 채워 넣음 -->
    </tbody>

</table>

<script>

    const API_URL = "https://6ae012358e42963c8d5ed564.mockapi.io/products";

    let products = [];
    let editId = null;

    const form = document.getElementById('productForm');
    const nameInput = document.getElementById('name');
    const categoryInput = document.getElementById('category');
    const priceInput = document.getElementById('price');
    const stockInput = document.getElementById('stock');
    const list = document.getElementById('productList');
    const saveBtn = document.getElementById('saveBtn');
    const searchInput = document.getElementById('searchInput');
    const message = document.getElementById('message');

    function showMessage(text, type) {
        message.innerText = text;
        message.className = type;
    }

    function render(){
        list.innerHTML = "";

        const keyword = searchInput.value.trim().toLowerCase();

        const filtered = products.filter(function(product) {
            return product.name.toLowerCase().includes(keyword);
        });

        filtered.forEach(function(product) {
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${product.id}</td>
                <td>${product.name}</td>
                <td>${product.category}</td>
                <td>${product.price}</td>
                <td>${product.stock}</td>
                <td>
                    <button class="edit" onclick="editProduct('${product.id}')">수정</button>
                    <button class="delete" onclick="deleteProduct('${product.id}')">삭제</button>
                </td>
            `;

            list.appendChild(row);
        });
    }

    async function getProducts() {
        try {
            const response = await fetch(API_URL);

            // 상태 코드가 200~299이면 true
            if (!response.ok) {
                throw new Error("실패 (" + response.status + ")");
            }

            // JSON을 자바스크립트 배열로 변환
            products = await response.json();
            render();
        } catch (error) {
            showMessage("실패" + error.message, "error");
        }
    }


    // 위와 같은 논리흐름
    function editProduct(id) {
        const product = products.find(function(product) {
            return product.id === id;
        });

        nameInput.value = product.name;
        categoryInput.value = product.category;
        priceInput.value = product.price;
        stockInput.value = product.stock;

        editId = id;
        saveBtn.innerText = "Save";
    }

    function deleteProduct(id) {
        // 팝업창 확인 요구
        if (!confirm("삭제하시겠습니까?")) {
            return;
        }  
        products = products.filter(function(product) {
            return product.id !== id;
        });
        render();
    }

render();
</script>

</body>
</html>
