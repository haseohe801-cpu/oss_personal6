<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Management</title>

    <style>
        body {
            font-family: Arial;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }
        form {
        background: #f5f5f5;
        padding: 20px;
        margin-bottom: 20px;
        }
        input, select, button {
            padding: 8px;
            margin-right: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        .edit {
            background: #3498db;
            color: white;
            border: none;
        }
        .delete {
            background: #e74c3c;
            color: white;
            border: none;
        }
        button:hover {
            opacity: 0.8;
        }
        #message {
            margin-bottom: 10px;
            font-weight: bold;
        }
        .error {
            color: #e74c3c;
        }
        .success {
            color: #27ae60;
        }
        #searchInput {
            width: 200px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
<h1>Product Management</h1>

    <div id="message"></div>

    <form id="productForm">
        <input type="text" id="name" placeholder="상품명">

        <select id="category">
            <option value="">카테고리 선택</option>
            <option value="Food">Food</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
        </select>

        <input type="number" id="price" placeholder="가격">
        <input type="number" id="stock" placeholder="재고">
        <button type="submit" id="saveBtn">Add</button>
    </form>

    <input type="text" id="searchInput" placeholder="상품명 검색">

<table>
    <thead>
        <tr>
            <th>id</th>
            <th>상품명</th>
            <th>카테고리</th>
            <th>가격</th>
            <th>재고</th>
            <th>제품관리</th>
        </tr>
    </thead>

    <tbody id="productList">
        <!-- 자바스크립트가 여기에 상품 줄<tr>들을 채워 넣음 -->
    </tbody>

</table>

<script>

    const API_URL = "https://6ae012358e42963c8d5ed564.mockapi.io/products";

    let products = [];
    let editId = null;

    const form = document.getElementById('productForm');
    const nameInput = document.getElementById('name');
    const categoryInput = document.getElementById('category');
    const priceInput = document.getElementById('price');
    const stockInput = document.getElementById('stock');
    const list = document.getElementById('productList');
    const saveBtn = document.getElementById('saveBtn');
    const searchInput = document.getElementById('searchInput');
    const message = document.getElementById('message');

    function showMessage(text, type) {
        message.innerText = text;
        message.className = type;
    }

    function render(){
        list.innerHTML = "";

        const keyword = searchInput.value.trim().toLowerCase();

        const filtered = products.filter(function(product) {
            return product.name.toLowerCase().includes(keyword);
        });

        filtered.forEach(function(product) {
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${product.id}</td>
                <td>${product.name}</td>
                <td>${product.category}</td>
                <td>${product.price}</td>
                <td>${product.stock}</td>
                <td>
                    <button class="edit" onclick="editProduct('${product.id}')">수정</button>
                    <button class="delete" onclick="deleteProduct('${product.id}')">삭제</button>
                </td>
            `;

            list.appendChild(row);
        });
    }

    // 새로고침 없이 자바스크립트로 처리
    form.addEventListener('submit', function(event) {
        event.preventDefault();

        if (nameInput.value.trim() === "") {
            alert("상품명을 입력하세요.");
            nameInput.focus();
            return;
        }
        if (categoryInput.value === "") {
            alert("카테고리를 선택하세요.");
            categoryInput.focus();
            return;
        }
        if (priceInput.value === "") {
            alert("가격을 입력하세요.");
            priceInput.focus();
            return;
        }
        if (stockInput.value === "") {
            alert("재고를 입력하세요.");
            stockInput.focus();
            return;
        }

        // editId가 null이면 새 상품을 추가, null이 아니면 기존 상품을 수정
        if (editId === null) {
            // push -> 배열 맨 뒤에 새 객체를 넣음. id는 배열의 마지막 요소의 id + 1로 설정
        products.push({ 
            id: products.length > 0 ? products[products.length - 1].id + 1 : 1,
            name: nameInput.value,
            category: categoryInput.value,
            price: Number(priceInput.value),
            stock: Number(stockInput.value)
        });
        } else {
            const product = products.find(function(product) {
            return product.id === editId;
        });

        product.name = nameInput.value;
        product.category = categoryInput.value;
        product.price = Number(priceInput.value);
        product.stock = Number(stockInput.value);

        // 끝나면 editId를 null로 되돌리고, 버튼 글자도 Add로 되돌림
        editId = null;
        saveBtn.innerText = "Add";
    }
        form.reset();
        render();
    });

    // 위와 같은 논리흐름
    function editProduct(id) {
        const product = products.find(function(product) {
            return product.id === id;
        });

        nameInput.value = product.name;
        categoryInput.value = product.category;
        priceInput.value = product.price;
        stockInput.value = product.stock;

        editId = id;
        saveBtn.innerText = "Save";
    }

    function deleteProduct(id) {
        // 팝업창 확인 요구
        if (!confirm("삭제하시겠습니까?")) {
            return;
        }  
        products = products.filter(function(product) {
            return product.id !== id;
        });
        render();
    }

render();
</script>

</body>
</html>
